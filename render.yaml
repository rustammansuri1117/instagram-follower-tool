databases:
  - name: instagram-growth-db
    plan: free
    databaseName: instagram_growth
    user: ig_user

services:
  - type: web
    name: instagram-growth
    plan: free
    runtime: python
    rootDir: instagram-growth
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "0"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: instagram-growth-db
          property: connectionString
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CONTACT_EMAIL
        value: support@example.com
      - key: CONTACT_PHONE
        value: "+91 00000 00000"
