<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | Instagram Growth</title>
  <meta name="robots" content="noindex">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="login-body">
  <div class="form-card login-card">
    <h1 class="h4 fw-bold mb-1"><i class="bi bi-instagram me-2 gradient-text"></i>Admin login</h1>
    <p class="text-muted small mb-4">Authorised administrators only.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    <form method="post" action="{{ url_for('admin.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label fw-semibold" for="username">Username</label>
        <input class="form-control" id="username" name="username" required autofocus autocomplete="username"></div>
      <div class="mb-4"><label class="form-label fw-semibold" for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password"></div>
      <button class="btn btn-gradient w-100" type="submit">Log in</button>
    </form>
    <a href="{{ url_for('main.index') }}" class="d-block text-center mt-3 small">Back to website</a>
  </div>
</body>
</html>
